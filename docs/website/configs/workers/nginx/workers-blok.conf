# Aanpassingen in /etc/nginx/sites-available/challenges op WEB-01

# 1. Bij "location /api/ { ... }" erbij zetten (starten duurt ongeveer 1 minuut):
#        proxy_read_timeout 300s;

# 2. Dit blok toevoegen vóór "location /c/ { ... }":

    # Per-sessie workers: /c/<worker-nr>-<instance>/
    location ~ ^/c/(?<wk>1[0-9][0-9])-[a-z0-9]+ {
        proxy_pass http://192.168.20.$wk:8081;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

# Het bestaande "location /c/" (naar DOCKER01) blijft staan voor sessies zonder worker.
